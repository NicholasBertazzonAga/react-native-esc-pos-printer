apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["EscPosPrinter_" + name]).toInteger()
}

android {
  namespace "com.escposprinter"

  buildFeatures {
    buildConfig true
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "true"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      java.srcDirs += ["generated/java"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation fileTree(dir: "libs", include: ["*.jar"])
  implementation 'com.google.android.gms:play-services-location:21.0.1'
}

react {
  jsRootDir = file("../src/")
  libraryName = "RNEscPosPrinterSpec"
  codegenJavaPackageName = "com.escposprinter"
}
